apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: microservices
  labels:
    app: payment
    version: v1

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment
      version: v1

  template:
    metadata:
      labels:
        app: payment
        version: v1

    spec:
      containers:
        - name: payment
          image: hashicorp/http-echo:1.0

          args:
            - "-text=Hello from Payment Service"
            - "-listen=:8080"

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 20m
              memory: 32Mi

            limits:
              cpu: 100m
              memory: 64Mi

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: microservices
  labels:
    app: payment

spec:
  type: ClusterIP

  selector:
    app: payment

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
